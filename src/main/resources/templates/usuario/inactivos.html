<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Usuarios inactivos | Sistema Tutorías TecNM</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin')}"></div>
    <main class="main">
        <div th:replace="~{fragments/layout :: topbar('Usuarios Inactivos')}"></div>
        <section class="card">
            <div class="card-title">
                🔴 Usuarios inactivos
                <a th:href="@{/usuarios}" class="btn btn-secondary btn-sm">← Volver a activos</a>
            </div>
            <div th:if="${#lists.isEmpty(usuarios)}"
                 style="text-align:center;padding:48px;color:#6b7280;">
                No hay usuarios inactivos.
            </div>
            <div th:unless="${#lists.isEmpty(usuarios)}" class="table-wrap">
                <table class="table">
                    <thead>
                        <tr><th>#</th><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.id}">-</td>
                            <td th:text="${u.nombre + ' ' + u.apellido}">-</td>
                            <td th:text="${u.correo}">-</td>
                            <td>
                                <span class="badge warn" th:if="${u.rol != null}" th:text="${u.rol.nombre}">-</span>
                            </td>
                            <td class="text-right">
                                <form th:action="@{'/usuarios/reactivar/' + ${u.id}}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-primary btn-sm">✅ Reactivar</button>
                                </form>
                                <a th:href="@{'/usuarios/detalle/' + ${u.id}}" class="btn btn-ghost btn-sm">Ver</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
