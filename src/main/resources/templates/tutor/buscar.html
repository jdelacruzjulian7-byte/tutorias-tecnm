<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Buscar tutores | Sistema Tutorias TecNM</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin')}"></div>

    <main class="main">
        <div th:replace="~{fragments/layout :: topbar('Buscar tutores')}"></div>

        <section class="card">
            <div class="card-title">Filtros</div>
            <form th:action="@{/tutores/buscar}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Semestre</label>
                        <input type="text" name="semestre" class="form-input"
                               th:value="${paramSemestre}" placeholder="Ej. 2026-1"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Carrera</label>
                        <input type="text" name="carrera" class="form-input"
                               th:value="${paramCarrera}" placeholder="ISC, IIA..."/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre del tutor</label>
                        <input type="text" name="nombre" class="form-input"
                               th:value="${paramNombre}" placeholder="Buscar por nombre..."/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select name="estatus" class="form-input">
                            <option value="">Todos</option>
                            <option value="ACTIVO" th:selected="${paramEstatus == 'ACTIVO'}">Activo</option>
                            <option value="INACTIVO" th:selected="${paramEstatus == 'INACTIVO'}">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-12 mt-16">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a th:href="@{/tutores/buscar}" class="btn btn-secondary">Limpiar</a>
                </div>
            </form>
        </section>

        <section class="card" th:if="${resultados != null}">
            <div class="card-title">
                Resultados
                <span class="text-muted" style="font-size:12px; font-weight:500;"
                      th:text="'(' + ${#lists.size(resultados)} + ' encontrados)'"></span>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tutor</th>
                            <th>Carrera</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th class="text-right">Accion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${resultados}">
                            <td th:text="${t.usuario != null} ? ${t.usuario.nombre + ' ' + t.usuario.apellido} : ${t.nombre}">-</td>
                            <td th:text="${t.carrera != null} ? ${t.carrera.nombre} : '-'">-</td>
                            <td th:text="${t.usuario != null} ? ${t.usuario.correo} : '-'">-</td>
                            <td>
                                <span th:if="${t.activo}" class="badge success">Activo</span>
                                <span th:unless="${t.activo}" class="badge danger">Inactivo</span>
                            </td>
                            <td class="text-right">
                                <a th:href="@{'/tutores/detalle/' + ${t.id}}" class="btn btn-ghost btn-sm">Ver</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(resultados)}">
                            <td colspan="5" class="text-center text-muted">
                                No se encontraron tutores con esos criterios.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

</body>
</html>
