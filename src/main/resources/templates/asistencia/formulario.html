<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Registrar asistencia | Sistema Tutorias TecNM</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin')}"></div>

    <main class="main">
        <div th:replace="~{fragments/layout :: topbar(${asistencia.id == null ? 'Tomar asistencia' : 'Editar asistencia'})}"></div>

        <section class="card" style="max-width:760px;">
            <div class="card-title"
                 th:text="${asistencia.id == null ? 'Tomar asistencia' : 'Editar asistencia'}">Asistencia</div>

            <p class="text-muted mb-16" style="font-size:13px;">
                Registra si el alumno se presento a la sesion. Cada registro cuenta para el calculo de su porcentaje (RF05).
            </p>

            <form th:action="@{/asistencias/guardar}" th:object="${asistencia}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tutorado *</label>
                        <select class="form-input" th:field="*{tutorado.id}" required>
                            <option value="">-- Selecciona tutorado --</option>
                            <option th:each="t : ${tutorados}"
                                    th:value="${t.id}"
                                    th:text="${t.usuario != null} ? ${t.usuario.nombre + ' ' + t.usuario.apellido + ' (' + t.matricula + ')'} : 'Tutorado #' + ${t.id}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sesion *</label>
                        <select class="form-input" th:field="*{sesion.id}" required>
                            <option value="">-- Selecciona sesion --</option>
                            <option th:each="s : ${sesiones}"
                                    th:value="${s.id}"
                                    th:text="${s.nombre + ' (' + s.fecha + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" th:field="*{presente}"
                               style="width:18px; height:18px; accent-color: var(--accent);"/>
                        <span>Presente en la sesion</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label">Observaciones (opcional)</label>
                    <textarea class="form-input" th:field="*{observacion}" rows="3"
                              placeholder="Notas, justificantes, etc."></textarea>
                </div>

                <div class="flex gap-12 mt-16">
                    <button type="submit" class="btn btn-primary">Guardar asistencia</button>
                    <a th:href="@{/asistencias}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</div>

</body>
</html>
