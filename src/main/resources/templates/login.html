<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iniciar sesion | Sistema Tutorias TecNM</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="login-page">

<div class="login-card">
    <div class="logo-wrap">
        <div class="logo-icon">T</div>
        <div class="logo-title">Sistema de Tutorias</div>
        <div class="logo-sub">TecNM &middot; Campus Chilpancingo</div>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Correo o contrasena incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        Cerraste sesion correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label class="form-label" for="username">Correo institucional</label>
            <input type="email" id="username" name="username"
                   class="form-input" placeholder="usuario@chilpancingo.tecnm.mx"
                   required autofocus/>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Contrasena</label>
            <input type="password" id="password" name="password"
                   class="form-input" placeholder="********" required/>
        </div>

        <button type="submit" class="btn btn-primary w-100" style="justify-content:center;">
            Iniciar sesion
        </button>
    </form>

    <p class="text-muted text-center mt-16" style="font-size:11px;">
        v1.0 &middot; Coordinacion Institucional de Tutorias
    </p>
</div>

</body>
</html>
