<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Documento | Sistema Tutorias TecNM</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin')}"></div>
    <main class="main">
        <div th:replace="~{fragments/layout :: topbar(${documento.id == null ? 'Nuevo documento' : 'Editar documento'})}"></div>

        <section class="card" style="max-width:700px;">
            <div class="card-title"
                 th:text="${documento.id == null ? 'Registrar documento' : 'Editar documento'}">
                Documento
            </div>

            <form th:action="@{/documentos/guardar}" th:object="${documento}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Alumno *</label>
                        <select class="form-input" name="usuario.id" required>
                            <option value="">-- Selecciona alumno --</option>
                            <option th:each="u : ${usuarios}"
                                    th:value="${u.id}"
                                    th:text="${u.nombre + ' ' + u.apellido + ' (' + u.correo + ')'}"
                                    th:selected="${documento.usuario != null and documento.usuario.id == u.id}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo *</label>
                        <select class="form-input" th:field="*{tipo}" required>
                            <option value="">-- Selecciona tipo --</option>
                            <option value="CARNET">📄 Carnet</option>
                            <option value="CONSTANCIA">📋 Constancia de asistencia</option>
                            <option value="OFICIO_TERMINO">✅ Oficio de término</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Semestre</label>
                        <select class="form-input" name="semestre.id">
                            <option value="">-- Selecciona semestre --</option>
                            <option th:each="s : ${semestres}"
                                    th:value="${s.id}"
                                    th:text="${s.nombre}"
                                    th:selected="${documento.semestre != null and documento.semestre.id == s.id}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha de emisión</label>
                        <input type="date" class="form-input" th:field="*{fechaEmision}"/>
                    </div>
                </div>

                <div class="flex gap-12" style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary"
                            th:text="${documento.id == null ? 'Guardar' : 'Actualizar'}">
                        Guardar
                    </button>
                    <a th:href="@{/documentos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
